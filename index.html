function viewOverview(){
  const y = String(DASH.year);
  const rows = DATA.countries.map(c => { const a = recFor(c.v, y); const t = a ? calcTotals(a) : null; return {c, a, st: statusOf(a), ov: t ? t.overall_avg : null, t}; });
  const sub = rows.filter(r => r.st === "Submitted"), prog = rows.filter(r => r.st === "In progress");
  let s = 0, n = 0, reds = 0; sub.forEach(r => { const t = r.t; s += t.total_red + t.total_amber * 2 + t.total_green * 3; n += t.total_red + t.total_amber + t.total_green; reds += t.total_red; });
  const avg = n ? s / n : null;
  rows.sort((a, b) => (a.ov ?? 9) - (b.ov ?? 9));
  return `<div class="kpis">
      <div class="kpi"><span class="l">Submitted to HO</span><span class="v">${sub.length}<small> / ${DATA.countries.length}</small></span><span class="s">${prog.length} in progress · ${DATA.countries.length - sub.length - prog.length} not started</span></div>
      <div class="kpi"><span class="l">Average compliance, submitted offices</span><span class="v">${fp(avg)}</span><span class="s">${avg != null ? `<span class="pill ${ragClass(avg)}">${rag(avg)}</span>` : "no submissions yet"}</span></div>
      <div class="kpi"><span class="l">Requirements not in compliance</span><span class="v">${reds}</span><span class="s">scored 1 across submitted offices</span></div>
      <div class="kpi"><span class="l">Offices with a red overall score</span><span class="v">${sub.filter(r => rag(r.ov) === "Red").length}</span><span class="s">overall compliance below 38%</span></div>
    </div>
    <div class="panel"><div class="panel-head"><div><h2>Compliance by section, ${esc(y)}</h2><p class="sub">Lowest overall first. Select a country to open its profile. ${THRESH}.</p></div></div>
    <div class="hm-scroll"><table class="hm"><thead><tr><th class="cn">Country office</th><th>Overall</th>${SECTIONS.map(s => `<th title="${esc(secName(s))}">${s.num}<span class="full">${esc(s.name.replace(" management","").replace("Staff and Management Support","Staff & Mgmt"))}</span></th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr data-c="${r.c.v}"><td class="cname">${esc(r.c.l)}${r.st !== "Submitted" ? `<span class="st">${r.st.toLowerCase()}</span>` : ""}</td>
      <td class="c-${ragClass(r.ov)} ov" data-tip="${esc(r.c.l)}: overall compliance ${r.ov != null ? fp(r.ov) : "no data"}">${fp(r.ov)}</td>
      ${SECTIONS.map(s => { const st = r.a ? calcSection(r.a, s.code) : null, v = st ? st[s.code + "_avg"] : null; return `<td class="c-${ragClass(v)}" data-tip="${esc(r.c.l)} · ${esc(secName(s))}: ${v != null ? fp(v) + ` compliance (${st[s.code+"_red"]} red, ${st[s.code+"_amber"]} amber, ${st[s.code+"_green"]} green)` : "not answered"}">${fp(v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}

function viewCountry(){
  const y = String(DASH.year), c = DASH.country, lab = lbl(DATA.countries, c), a = recFor(c, y);
  if (!a) return `<div class="panel"><h2>${esc(lab)} has not started its ${esc(y)} assessment</h2><p class="sub">Nothing to show yet. Choose another year to see earlier results.</p></div>`;
  const t = calcTotals(a), prev = recFor(c, String(Number(y) - 1)), pt = prev ? calcTotals(prev) : null;
  const answered = t.total_done, n = ITEMS.length, ov = t.overall_avg;
  const delta = (ov != null && pt && pt.overall_avg != null) ? ov - pt.overall_avg : null;
  const reds = ITEMS.filter(it => a[it.id] === "1"), ambers = ITEMS.filter(it => a[it.id] === "2");
  const overallSt = {r:t.total_red, am:t.total_amber, g:t.total_green, na:t.total_na};
  return `<div class="kpis">
      <div class="kpi"><span class="l">Overall compliance</span><span class="v">${fp(ov)}</span><span class="s">${ov != null ? `<span class="pill ${ragClass(ov)}">${rag(ov)}</span>` : ""} ${delta != null ? `${dArrow(delta)} <span class="delta">vs ${Number(y) - 1}</span>` : ""}</span></div>
      <div class="kpi"><span class="l">Status</span><span class="v" style="font-size:1.2rem">${statusOf(a)}</span><span class="s">${a.submitted_by ? `by ${esc(a.submitted_by)}${a.submitted_at ? ", " + new Date(a.submitted_at).toLocaleDateString() : ""}` : "not yet submitted"}</span></div>
      <div class="kpi"><span class="l">Requirements answered</span><span class="v">${answered}<small> / ${n}</small></span><span class="s">${pct(answered, n)}% complete</span></div>
      <div class="kpi"><span class="l">Not in compliance</span><span class="v">${t.total_red}</span><span class="s">${t.total_amber} partially · ${t.total_green} fully · ${t.total_na} N/A</span></div>
    </div>
    <div class="two">
      <div class="panel"><h2>All requirements</h2><p class="sub">Share of the ${n} requirements by score.</p>
        <div class="dn-big">${donut(segsOf(overallSt, "All sections"), n, 200, 30, fp(ov), "compliance")}
          <table class="dn-tab"><tbody>${[["red","1 · Not in compliance",t.total_red],["amber","2 · Partially",t.total_amber],["green","3 · Fully",t.total_green],["na","N/A",t.total_na],["empty","Not answered",n - answered]].map(([cc, l, v]) => `<tr><td><i class="dot" style="background:var(--${cc})${cc === "empty" ? ";outline:1px solid var(--line)" : ""}"></i>${l}</td><td class="num">${v}</td><td class="num muted">${pct(v, n)}%</td></tr>`).join("")}</tbody></table></div></div>
      <div class="panel"><h2>Needs attention</h2><p class="sub">Requirements scored 1 or 2, grouped by section.</p>
        <div class="att-tabs" role="tablist">
          <button role="tab" class="att-tab r" data-att="r" aria-selected="${DASH.attTab !== "a"}"><i class="dot" style="background:var(--red)"></i>Not in compliance <b>${reds.length}</b></button>
          <button role="tab" class="att-tab a" data-att="a" aria-selected="${DASH.attTab === "a"}"><i class="dot" style="background:var(--amber)"></i>Partially in compliance <b>${ambers.length}</b></button>
        </div>
        ${[["r", reds, "1"], ["a", ambers, "2"]].map(([k, list, sc]) => `<div class="att-list" data-list="${k}" ${(DASH.attTab === "a") === (k === "a") ? "" : "hidden"}>${list.length ? SECTIONS.filter(s => list.some(it => it.code === s.code)).map(s => { const its = list.filter(it => it.code === s.code);
          return `<div class="att-sec"><div class="att-h">${esc(secName(s))} <span class="muted">· ${its.length}</span></div><ul class="att">${its.map(it => `<li class="att-${k}"><span class="mono q-id">${it.id.replace("_","-")}</span><div><div>${esc(it.q)}</div>${a[it.id + "_comment"] ? `<div class="hint">“${esc(a[it.id + "_comment"])}”</div>` : ""}</div></li>`).join("")}</ul></div>`; }).join("") : `<p class="muted">No requirements scored ${sc}.</p>`}</div>`).join("")}
      </div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Scores by section</h2><p class="sub">Each ring shows the share of the section's requirements by score; the percentage is the section's compliance.</p></div>${legend()}</div>
      <div class="sec-grid">${SECTIONS.map(s => { const st = calcSection(a, s.code), m = bySec(s.code).length, v = st[s.code+"_avg"], ps = prev ? calcSection(prev, s.code)[s.code+"_avg"] : null, d = (v != null && ps != null) ? v - ps : null;
        return `<div class="sec-card">${donut(segsOf({r:st[s.code+"_red"], am:st[s.code+"_amber"], g:st[s.code+"_green"], na:st[s.code+"_na"]}, secName(s)), m, 92, 14, fp(v))}
          <div class="sc-t"><b>${esc(secName(s))}</b><span>${st[s.code+"_red"]} red · ${st[s.code+"_amber"]} amber · ${st[s.code+"_green"]} green${st[s.code+"_na"] ? ` · ${st[s.code+"_na"]} N/A` : ""}</span><span class="muted">${st[s.code+"_done"]}/${m} answered${d != null ? ` · ${dArrow(d)}` : ""}</span></div></div>`; }).join("")}</div></div>`;
}


/* ---- By section: one thematic area across the whole portfolio ---- */
function hbar(st, label, tipPrefix){ // horizontal 100% bar of red/amber/green/na/unanswered
  const tot = st.r + st.am + st.g + st.na + (st.open || 0);
  if (!tot) return `<div class="hb-bar"></div>`;
  const seg = (n, c, l) => n ? `<i style="flex:${n};background:var(--${c})" data-tip="${esc(tipPrefix)}: ${n} ${l} (${pct(n, tot)}%)"></i>` : "";
  return `<div class="hb-bar" aria-label="${esc(label)}">${seg(st.r,"red","not in compliance")}${seg(st.am,"amber","partially")}${seg(st.g,"green","fully")}${seg(st.na,"na","N/A")}${seg(st.open || 0,"empty","not answered")}</div>`;
}
function viewSection(){
  const y = String(DASH.year), code = DASH.section || SECTIONS[0].code, s = SECTIONS.find(x => x.code === code), its = bySec(code), py = String(Number(y) - 1);
  // offices that have answered at least one requirement in this section this year
  const offices = DATA.countries.map(c => { const a = recFor(c.v, y), p = recFor(c.v, py);
    const st = a ? calcSection(a, code) : null, ps = p ? calcSection(p, code) : null;
    const avg = st ? st[code+"_avg"] : null, pavg = ps ? ps[code+"_avg"] : null;
    return {c, a, st: st ? {r:st[code+"_red"], am:st[code+"_amber"], g:st[code+"_green"], na:st[code+"_na"], open: its.length - st[code+"_done"]} : null,
      avg, pavg, d: (avg != null && pavg != null) ? avg - pavg : null, status: statusOf(a)}; });
  const rep = offices.filter(o => o.avg != null);
  if (!rep.length) return `<div class="panel"><h2>No office has answered ${esc(secName(s))} for ${esc(y)} yet</h2><p class="sub">Choose another year, or check back once offices have started.</p></div>`;
  const avgOf = list => { let sum = 0, n = 0; list.forEach(o => { sum += o.st.r + o.st.am * 2 + o.st.g * 3; n += o.st.r + o.st.am + o.st.g; }); return n ? sum / n : null; };
  const port = avgOf(rep);
  const prevRep = DATA.countries.map(c => { const p = recFor(c.v, py); if (!p) return null; const ps = calcSection(p, code); return ps[code+"_avg"] != null ? {st:{r:ps[code+"_red"], am:ps[code+"_amber"], g:ps[code+"_green"]}} : null; }).filter(Boolean);
  const pport = avgOf(prevRep), dport = (port != null && pport != null) ? port - pport : null;
  const nR = rep.filter(o => rag(o.avg) === "Red").length, nA = rep.filter(o => rag(o.avg) === "Amber").length, nG = rep.filter(o => rag(o.avg) === "Green").length;
  // requirement-level picture across offices
  const reqs = its.map(it => { const sc = {r:0, am:0, g:0, na:0, open:0};
    offices.forEach(o => { if (!o.a || o.avg == null) return; const v = o.a[it.id]; if (v === "1") sc.r++; else if (v === "2") sc.am++; else if (v === "3") sc.g++; else if (v === "na") sc.na++; else sc.open++; });
    const scored = sc.r + sc.am + sc.g; return {it, sc, scored, gap: scored ? (sc.r + sc.am * .5) / scored : 0, avg: scored ? (sc.r + sc.am * 2 + sc.g * 3) / scored : null}; });
  const reqSorted = reqs.slice().sort((a, b) => b.gap - a.gap);
  const offSorted = rep.slice().sort((a, b) => a.avg - b.avg);
  const missing = offices.filter(o => o.a && o.avg == null), notStarted = offices.filter(o => !o.a);
  // suggested actions, most important first
  const acts = [];
  reqSorted.filter(r => r.scored >= 3 && (r.sc.r + r.sc.am) / r.scored >= .5).slice(0, 3).forEach(r => acts.push({p:"h",
    t:`Portfolio-wide gap: ${r.it.id.replace("_","-")}`, d:`${r.sc.r + r.sc.am} of ${r.scored} offices are not fully compliant (${r.sc.r} red, ${r.sc.am} amber): “${r.it.q.length > 110 ? r.it.q.slice(0, 108) + "…" : r.it.q}”`,
    w: r.it.nogov ? "No governing document yet: publish HO guidance or a standard first, then offer training to all offices." : "Run a cross-office training or webinar and share a good-practice example from a green office."}));
  const reds = offSorted.filter(o => rag(o.avg) === "Red");
  if (reds.length) acts.push({p:"h", t:`Support ${reds.length} office${reds.length === 1 ? "" : "s"} in red`, d:reds.map(o => `${o.c.l} ${fp(o.avg)}`).join(" · "), w:"Schedule a follow-up call with each office and agree corrective actions in the master action list."});
  const decl = offices.filter(o => o.d != null && o.d <= -0.2).sort((a, b) => a.d - b.d);
  if (decl.length) acts.push({p:"m", t:`${decl.length} office${decl.length === 1 ? "" : "s"} declining by 10 pts or more since ${py}`, d:decl.map(o => `${o.c.l} ${fpp(o.d)}`).join(" · "), w:"Ask each office what changed (staff turnover, new systems) and whether support is needed."});
  if (missing.length || notStarted.length) acts.push({p:"m", t:`Not reported: ${missing.length + notStarted.length} office${missing.length + notStarted.length === 1 ? "" : "s"}`, d:[...missing, ...notStarted].map(o => o.c.l).join(", ") + ".", w:"Remind the section lead in these offices to complete this section before the deadline."});
  const champs = offSorted.filter(o => cp(o.avg) >= 90).map(o => o.c.l);
  if (champs.length) acts.push({p:"l", t:`Good practice: ${champs.length} office${champs.length === 1 ? "" : "s"} at 90% or above`, d:champs.join(", ") + ".", w:"Ask them to share templates and routines with offices that score red or amber."});
  const nogovN = its.filter(i => i.nogov).length;
  if (nogovN) acts.push({p:"l", t:`${nogovN} of ${its.length} requirements have no governing document`, d:"Offices are asked to comply without an HO standard to follow.", w:"Prioritise writing guidance for the requirements with the most red and amber scores."});
  // trend: portfolio compliance in this section, every year with data
  const yrs = yearsAvail().filter(yy => DATA.countries.some(c => { const a = recFor(c.v, yy); return a && calcSection(a, code)[code+"_avg"] != null; }));
  const trendPts = yrs.map(yy => ({x: yy, y: avgOf(DATA.countries.map(c => { const a = recFor(c.v, yy); if (!a) return null; const q = calcSection(a, code); return q[code+"_avg"] != null ? {st:{r:q[code+"_red"], am:q[code+"_amber"], g:q[code+"_green"]}} : null; }).filter(Boolean))}));
  const prLabel = {h:"High", m:"Medium", l:"Low"};
  return `
  <p class="note"><b>${esc(secName(s))}</b> · ${its.length} requirements · Suggested respondent in offices: ${esc(s.respondent)}. Use this page to see where the portfolio stands, which offices need support and which requirements need HO action.</p>
  <div class="kpis">
    <div class="kpi"><span class="l">Portfolio compliance, ${esc(y)}</span><span class="v">${fp(port)}</span><span class="s"><span class="pill ${ragClass(port)}">${rag(port)}</span>${dport != null ? dArrow(dport) + ` <span class="delta">vs ${py}</span>` : ""}</span></div>
    <div class="kpi"><span class="l">Offices by status</span><span class="v kv3"><span style="color:var(--red)">${nR}</span><span style="color:var(--amber)">${nA}</span><span style="color:var(--green)">${nG}</span></span><span class="s">red · amber · green, of ${rep.length} reporting</span></div>
    <div class="kpi"><span class="l">Weakest requirement</span><span class="v" style="font-size:1.25rem">${reqSorted[0].it.id.replace("_","-")}</span><span class="s">${fp(reqSorted[0].avg)} compliance across offices</span></div>
    <div class="kpi"><span class="l">Offices not yet reporting</span><span class="v">${missing.length + notStarted.length}<small> / ${DATA.countries.length}</small></span><span class="s">${missing.length} started but skipped this section</span></div>
  </div>
  <div class="two">
    <div class="panel"><h2>What to do next</h2><p class="sub">Generated from this year's scores, most urgent first.</p>
      <ul class="steps">${acts.slice(0, 9).map(x => `<li class="step"><span class="pr ${x.p}">${prLabel[x.p]}</span><div><div class="t">${esc(x.t)}</div><div class="d">${esc(x.d)}</div><div class="act">${esc(x.w)}</div></div></li>`).join("") || `<li class="muted">No actions: every reporting office is green.</li>`}</ul></div>
    <div class="panel"><h2>Portfolio compliance over time</h2><p class="sub">All reporting offices combined, ${esc(secName(s))}. Background bands: ${THRESH}.</p>${trendPts.length ? lineChart(trendPts) : `<p class="muted">No earlier years yet.</p>`}</div>
  </div>
  <div style="margin-top:16px">
    <div class="panel"><div class="panel-head"><div><h2>Offices, weakest first</h2><p class="sub">Share of this section's requirements by score, with compliance and change since ${py}.</p></div></div>
      <div class="hb">${offSorted.map(o => `<div class="hb-row" data-c2="${o.c.v}" title="Open ${esc(o.c.l)}'s country profile"><span class="hb-l">${esc(o.c.l)}${o.status !== "Submitted" ? ` <span class="st">in progress</span>` : ""}</span>${hbar(o.st, o.c.l, o.c.l)}<span class="hb-v"><b class="pill ${ragClass(o.avg)}">${fp(o.avg)}</b>${o.d != null ? dArrow(o.d) : `<span class="delta">new</span>`}</span></div>`).join("")}</div>${legend()}</div>
  </div>
  <div style="margin-top:16px">
    <div class="panel"><div class="panel-head"><div><h2>Requirements, biggest gaps first</h2><p class="sub">How many offices scored each requirement 1, 2 or 3. <span class="tag">no HO doc</span> = no governing document yet.</p></div></div>
      <div class="hb">${reqSorted.map(r => `<div class="hb-row rqfull"><span class="hb-l"><span class="mono">${r.it.id.replace("_","-")}</span> ${esc(r.it.q)}${r.it.nogov ? ` <span class="tag">no HO doc</span>` : ""}</span>${hbar(r.sc, r.it.id, r.it.id.replace("_","-"))}<span class="hb-v"><b class="pill ${ragClass(r.avg)}">${fp(r.avg)}</b></span></div>`).join("")}</div>${legend()}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Requirement by office</h2><p class="sub">Every score in ${esc(secName(s))} for ${esc(y)}. Rows are requirements (biggest gaps first), columns are offices (weakest first). Hover a cell for details; click an office name for its profile.</p>
    <div class="hm-scroll"><table class="mx mxs"><thead><tr><th class="rq">Requirement</th>${offSorted.map(o => `<th class="cc" data-c2="${o.c.v}" data-tip="${esc(o.c.l)}">${esc(iso3(o.c))}</th>`).join("")}<th class="cnt">Offices<br>red / amber</th></tr></thead>
    <tbody>${reqSorted.map(r => `<tr><td class="rq wrap"><span class="mono">${r.it.id.replace("_","-")}</span> ${esc(r.it.q)}</td>${offSorted.map(o => { const v = o.a[r.it.id]; const cls = v === "1" ? "c-r" : v === "2" ? "c-a" : v === "3" ? "c-g" : v === "na" ? "c-n" : "c-x";
      return `<td class="${cls}" data-tip="${esc(o.c.l)} · ${r.it.id.replace("_","-")}: ${v === "na" ? "N/A" : v ? LABEL[v] : "not answered"}${o.a[r.it.id + "_comment"] ? " — “" + esc(o.a[r.it.id + "_comment"]) + "”" : ""}">${v === "na" ? "–" : v || ""}</td>`; }).join("")}<td class="cnt">${r.sc.r} / ${r.sc.am}</td></tr>`).join("")}</tbody></table></div>
    ${legend()}</div>`;
}

function viewTrend(){
  const c = DASH.country, lab = lbl(DATA.countries, c);
  const recs = (DASH.data || []).filter(a => a.country === c).sort((x, y) => Number(x.assessment_year) - Number(y.assessment_year));
  if (!recs.length) return `<div class="panel"><h2>No assessments yet for ${esc(lab)}</h2></div>`;
  const pts = recs.map(a => ({x:String(a.assessment_year), y:calcTotals(a).overall_avg, a}));
  const valid = pts.filter(p => p.y != null);
  let headline = "Only one year of results so far; the trend appears from the second year.";
  if (valid.length >= 2) { const f = valid[0], l = valid[valid.length - 1], d = l.y - f.y;
    headline = `<b>${d > 0.1 ? "Improving" : d < -0.1 ? "Declining" : "Stable"}:</b> overall compliance ${fp(f.y)} in ${f.x} → ${fp(l.y)} in ${l.x} (${fpp(d)}).`; }
  const last2 = valid.slice(-2);
  const secRows = SECTIONS.map(s => { const vals = pts.map(p => calcSection(p.a, s.code)[s.code+"_avg"]);
    const a1 = last2.length === 2 ? calcSection(last2[0].a, s.code)[s.code+"_avg"] : null, a2 = last2.length === 2 ? calcSection(last2[1].a, s.code)[s.code+"_avg"] : null, d = (a1 != null && a2 != null) ? a2 - a1 : null;
    return {s, vals, d}; });
  const up = secRows.filter(r => r.d != null && r.d > 0.04).length, down = secRows.filter(r => r.d != null && r.d < -0.04).length;
  return `<p class="note">${headline}${last2.length === 2 ? ` Since ${last2[0].x}: ${up} section${up === 1 ? "" : "s"} improved, ${down} declined.` : ""}</p>
    <div class="two">
      <div class="panel"><h2>Overall compliance</h2><p class="sub">${esc(lab)}, by year. Background bands: ${THRESH}.</p>${lineChart(pts)}</div>
      <div class="panel"><div class="panel-head"><div><h2>Share of scores</h2><p class="sub">Answered requirements by score, each year.</p></div></div>${stackCols(pts.map(p => ({x:p.x, st:{r:calcTotals(p.a).total_red, am:calcTotals(p.a).total_amber, g:calcTotals(p.a).total_green, na:calcTotals(p.a).total_na}})))}${legend()}</div>
    </div>
    <div class="panel" style="margin-top:16px"><h2>Section compliance by year</h2><p class="sub">The last column compares the two most recent years.</p>
      <div class="hm-scroll"><table class="hm tr"><thead><tr><th class="cn">Section</th>${pts.map(p => `<th>${p.x}</th>`).join("")}<th>Change</th></tr></thead>
      <tbody>${secRows.map(r => `<tr><td class="cname">${esc(secName(r.s))}</td>${r.vals.map((v, i) => `<td class="c-${ragClass(v)}" data-tip="${esc(secName(r.s))}, ${pts[i].x}: ${v != null ? fp(v) + " compliance" : "not answered"}">${fp(v)}</td>`).join("")}<td class="chg">${r.d == null ? "–" : dArrow(r.d)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ---- tooltip ---- */
document.addEventListener("mousemove", e => { const t = document.getElementById("tip"), el = e.target.closest && e.target.closest("[data-tip]");
  if (!el) { t.hidden = true; return; } t.textContent = el.getAttribute("data-tip"); t.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - t.offsetWidth - 8), y = e.clientY + 16 + t.offsetHeight > window.innerHeight ? e.clientY - t.offsetHeight - 10 : e.clientY + 16;
  t.style.left = x + "px"; t.style.top = y + "px"; });

/* ---- switching between form and dashboard ---- */
function setTabs(){ document.getElementById("tab-form").setAttribute("aria-selected", APP.view === "form"); document.getElementById("tab-dlv").setAttribute("aria-selected", APP.view === "dlv"); document.getElementById("tab-dash").setAttribute("aria-selected", APP.view === "dash"); document.getElementById("savest").style.visibility = APP.view === "dash" ? "hidden" : ""; }
function showMain(){ setTabs(); if (APP.view === "dash") renderDash(); else if (!APP.oid) renderStart(); else if (APP.view === "dlv") renderDlv(); else renderForm(); window.scrollTo({top:0}); }
async function switchView(v){ APP.view = v; LS.set("coar-view", v); history.replaceState(null, "", location.pathname + (v === "dash" ? (DASH.mode === "section" ? "#section-" + (DASH.section || SECTIONS[0].code) : DASH.mode === "dlv" ? "#deliverables-dashboard" : "#dashboard") : v === "dlv" ? "#deliverables" : "")); setTabs(); if (!APP.user) return; if (APP.oid) await flush(); showMain(); }

/* ================= BOOT ================= */
// Links: #dashboard opens the dashboards; #section-FIN (any section code) opens that section's dashboard directly.
function dashHash(){ LS.set("coar-dash", {mode:DASH.mode, section:DASH.section}); if (APP.view === "dash") history.replaceState(null, "", location.pathname + (DASH.mode === "section" ? "#section-" + (DASH.section || SECTIONS[0].code) : DASH.mode === "dlv" ? "#deliverables-dashboard" : "#dashboard")); }
(function(){ const h = location.hash.replace("#", ""), m = h.match(/^section-([A-Za-z]+)$/);
  if (m && SECTIONS.some(s => s.code === m[1].toUpperCase())) { DASH.mode = "section"; DASH.section = m[1].toUpperCase(); LS.set("coar-dash", {mode:"section", section:DASH.section}); APP.view = "dash"; }
  else if (h === "dashboard") APP.view = "dash";
  else if (h === "deliverables") APP.view = "dlv";
  else if (h === "deliverables-dashboard") { APP.view = "dash"; DASH.mode = "dlv"; LS.set("coar-dash", {mode:"dlv"}); }
  else APP.view = LS.get("coar-view") || "form";
  const saved = LS.get("coar-dash"); if (!m && saved && APP.view === "dash" && !h) { DASH.mode = saved.mode || DASH.mode; DASH.section = saved.section; }
})();
document.getElementById("tab-form").onclick = () => switchView("form");
document.getElementById("tab-dash").onclick = () => switchView("dash");
document.getElementById("tab-dlv").onclick = () => switchView("dlv");
setTabs();
async function boot(){
  if (window.COAR_EXPECT_CONFIG && !window.COAR_CONFIG) {
    $app().innerHTML = `<div class="card"><div><div class="eyebrow">Setup problem</div><h1>The settings file could not be read</h1></div>
      <p>${window.COAR_CONFIG_MISSING ? "config.js was not found next to this page. Check that a file named exactly <b>config.js</b> (all lowercase, not config (1).js or config.js.txt) is in the same place as index.html on GitHub." : "config.js was found but contains a typing error, so it could not be read. Check that no quote marks, commas or brackets were removed or added, or upload a fresh copy."}</p></div>`;
    return;
  }
  if (DEMO) {
    document.getElementById("demo-chip").hidden = false;
    APP.user = {name:"Demo user", email:"", username:"demo"};
    document.getElementById("who").textContent = "Demo user";
    showMain(); return;
  }
  const q = new URLSearchParams(location.search);
  if (q.get("code") || q.get("error")) {
    if (window.opener && window.opener !== window) {        // popup: hand the result to the page inside SharePoint
      try { window.opener.postMessage({type:"coar-auth", code:q.get("code"), state:q.get("state"), error:q.get("error_description")}, location.origin); } catch(e){}
      document.body.innerHTML = "<p style='font-family:sans-serif;padding:24px'>Signed in. You can close this window.</p>"; window.close(); return;
    }
    history.replaceState(null, "", location.pathname);
    if (q.get("error")) { renderSignIn(q.get("error_description") || "Sign-in was cancelled."); return; }
    try { await Auth.exchange(q.get("code"), q.get("state")); } catch(e) { renderSignIn(e.message); return; }
  }
  if (!Auth.valid() && !(await Auth.refresh())) { renderSignIn(); return; }
  await afterSignIn();
}
async function afterSignIn(){
  try {
    const me = await agsPost(`${CONFIG.PORTAL_URL}/sharing/rest/community/self`, {});
    APP.user = {name: me.fullName || me.username, email: me.email || "", username: me.username};
  } catch(e) { renderSignIn(e.message); return; }
  document.getElementById("who").innerHTML = `${esc(APP.user.name)} · <button class="linkbtn" id="signout">Sign out</button>`;
  document.getElementById("signout").onclick = async () => { await flush(); Auth.signOut(); };
  if (APP.oid) flush();
  showMain();
}
window.addEventListener("message", async e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "coar-auth") return;
  if (e.data.error || !e.data.code) { renderSignIn(e.data.error || "Sign-in was cancelled."); return; }
  try { await Auth.exchange(e.data.code, e.data.state); await afterSignIn(); } catch(err) { renderSignIn(err.message); }
});
boot();
</script>
