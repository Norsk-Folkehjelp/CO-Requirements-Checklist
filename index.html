<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CO Annual Requirements</title>
</head>
<body>
<style>
/* Layout: top bar with save status; start screen card; form = section rail + question cards with traffic-light boxes */
:root{
  /* NPA visual identity, as in the Annual Operational Planning Tool: NPA green header, light grey-green ground, Arial */
  --bg:#F3F4F2; --surface:#FFFFFF; --surface-2:#F6F7F5; --line:#DCDDDA; --fg:#1A1A1A; --muted:#5E5E5E;
  --accent:#007745; --accent-hover:#006C36; --accent-bright:#009933; --accent-fg:#FFFFFF; --accent-soft:#E3F2E8;
  --red:#E2001A; --red-soft:#FDE6E8; --amber:#F2A900; --amber-soft:#FDF1D3; --green:#007745; --green-soft:#E3F2E8;
  --na:#8E918B; --na-soft:#EDEEEC; --empty:#E6E7E4; --amber-fg:#2B2100; --on-solid:#FFFFFF;
  --f-body:Arial,Helvetica,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-fg);border-bottom:4px solid var(--accent-bright)}
.npa{font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap}
.npa-div{width:1px;align-self:stretch;background:#7FB89B;min-height:36px}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:1.02rem}
.brand span{font-size:.78rem;opacity:.85}
.savest{display:flex;align-items:center;gap:7px;font-size:.82rem;background:rgba(0,0,0,.18);padding:5px 11px;border-radius:99px;white-space:nowrap}
.savest i{width:9px;height:9px;border-radius:50%;background:#7fd48f;display:inline-block}
.savest[data-s="saving"] i{background:#f3d36b}
.savest[data-s="offline"] i,.savest[data-s="error"] i{background:#ff8a80}
.who{font-size:.8rem;opacity:.9;white-space:nowrap}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0}
.demo-chip{font-size:.72rem;border:1px solid currentColor;border-radius:99px;padding:2px 8px;white-space:nowrap}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--r);padding:24px;max-width:680px;margin:24px auto;display:grid;gap:16px}
.card h1{font-size:1.4rem}
.card p{margin:0;color:var(--muted)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld input:disabled,.fld select:disabled{background:var(--surface-2)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-solid)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:.86rem;border-radius:6px;padding:10px 14px;background:var(--accent-soft)}
.note.warn{background:var(--amber-soft)}
.note.err{background:var(--red-soft)}
.note.ok{background:var(--green-soft)}

.form-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;max-height:calc(100vh - 100px);overflow:auto}
.rail h3{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.rail button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft)}
.rail .nm{font-size:.85rem;font-weight:500;min-width:0}
.rail .ct{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
.minibar,.stack{display:flex;border-radius:2px;overflow:hidden;background:var(--empty)}
.minibar{grid-column:1/-1;height:4px}
.stack{height:12px;border-radius:3px}
.minibar i,.stack i{display:block;height:100%}
.rail-sel.fld{display:none}

.hero{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--r);padding:18px 22px;display:grid;gap:12px}
.hero-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.hero h1{font-size:1.35rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.progress{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--muted)}
.progress .bar{flex:1;height:8px;background:var(--empty);border-radius:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

.sec-head{margin:24px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.25rem}
.edited{font-size:.8rem;color:var(--muted)}
.sub-h{margin:22px 0 8px;font-size:.9rem;font-weight:700;color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;margin-bottom:10px;border-left:5px solid var(--line)}
.q[data-s="1"]{border-left-color:var(--red)}
.q[data-s="2"]{border-left-color:var(--amber)}
.q[data-s="3"]{border-left-color:var(--green)}
.q[data-s="na"]{border-left-color:var(--na)}
.q-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-id{color:var(--muted);flex:none}
.q-text{font-weight:600;max-width:80ch;flex:1;min-width:0}
.prev{font-size:.74rem;color:var(--muted);white-space:nowrap}
.hint{font-size:.84rem;color:var(--muted)}
.docs{display:flex;flex-wrap:wrap;gap:6px}
.doc{font-size:.78rem;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;color:var(--fg);max-width:100%}
a.doc:hover{border-color:var(--accent);color:var(--accent)}
.doc.gap{background:transparent;border-style:dashed;color:var(--muted)}
.doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(70px,auto);gap:8px}
.ch{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;min-width:0}
.ch b{font-size:1rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.ch small{font-size:.82rem;line-height:1.2}
.ch:hover:not(:disabled){border-color:var(--muted)}
.ch:disabled{cursor:default}
.ch[data-v="1"][aria-pressed="true"]{border-color:var(--red);background:var(--red);color:var(--on-solid)}
.ch[data-v="2"][aria-pressed="true"]{border-color:var(--amber);background:var(--amber);color:var(--amber-fg)}
.ch[data-v="3"][aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--on-solid)}
.ch[aria-pressed="true"] b{background:rgba(255,255,255,.28)}
.ch[data-v="na"]{justify-content:center}
.ch[data-v="na"][aria-pressed="true"]{border-color:var(--na);background:var(--na);color:var(--on-solid)}
.follow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,.9fr);gap:10px;background:var(--surface-2);border-radius:6px;padding:10px 12px}
.follow.one{grid-template-columns:minmax(0,1fr)}
.req{color:var(--red)}
.nav-btns{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.review{display:grid;gap:8px}
.rv-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 110px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.n{background:var(--na-soft);color:var(--muted)}
.jump{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.confirm{display:grid;gap:10px;border:2px solid var(--accent);border-radius:8px;padding:14px;background:var(--surface)}
.demo-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.8rem;background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px;color:var(--muted)}
.demo-bar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}


/* tabs + dashboard */
.vtabs{display:flex;gap:4px;background:rgba(0,0,0,.18);padding:3px;border-radius:8px}
.vtabs button{border:0;background:transparent;color:inherit;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem}
.vtabs button[aria-selected="true"]{background:var(--accent-fg);color:var(--accent)}
.dash-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dash-head h1{font-size:1.4rem}
.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.filters .fld{min-width:200px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:.86rem;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:1rem;color:var(--muted);font-weight:500}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .s{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill.x{background:var(--na-soft);color:var(--muted)}
.delta{font-weight:700;font-size:.78rem;color:var(--muted);white-space:nowrap}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:1rem;margin-bottom:2px}
.panel .sub{font-size:.8rem;color:var(--muted);margin:0 0 12px}
.panel-head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.hm-scroll{overflow-x:auto}
table.hm{border-collapse:separate;border-spacing:3px;font-size:.8rem;width:100%}
table.hm:not(.tr){min-width:940px}
.hm th{font-weight:600;color:var(--muted);font-size:.7rem;text-align:center;vertical-align:bottom;padding:2px}
.hm th.cn{text-align:left}
.hm th .full{display:block;font-weight:400;font-size:.64rem;line-height:1.15;max-width:62px;margin:0 auto}
.hm td{height:30px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums;font-weight:600;min-width:40px}
.hm td.cname{text-align:left;font-weight:500;white-space:nowrap;padding:0 8px;min-width:170px}
.hm tr[data-c]{cursor:pointer}
.hm tr[data-c]:hover td.cname{color:var(--accent)}
.hm td.ov{box-shadow:inset 0 0 0 2px var(--fg)}
.hm td.chg{font-weight:400}
.st{font-size:.68rem;font-weight:600;margin-left:6px;color:var(--muted)}
.c-r{background:var(--red);color:var(--on-solid)} .c-a{background:var(--amber);color:var(--amber-fg)} .c-g{background:var(--green);color:var(--on-solid)} .c-x{background:var(--empty);color:var(--muted);font-weight:400}
.donut{display:block;flex:none;overflow:visible}
.donut circle[data-tip]{cursor:default}
.dn-c{font-weight:700;fill:var(--fg);font-variant-numeric:tabular-nums}
.dn-s{fill:var(--muted)}
.dn-big{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.dn-tab{border-collapse:collapse;font-size:.86rem}
.dn-tab td{padding:4px 8px;border-bottom:1px solid var(--line)}
.dn-tab td:first-child{display:flex;align-items:center;gap:8px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.att-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.att-tab{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.att-tab b{font-variant-numeric:tabular-nums}
.att-tab.r[aria-selected="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.att-tab.a[aria-selected="true"]{border-color:var(--amber);background:var(--amber-soft);color:var(--fg)}
.att-list{max-height:340px;overflow:auto;display:grid;gap:12px;padding-right:4px}
.att-h{font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:4px}
.att{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.86rem}
.att li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:6px 10px;border-radius:6px;border-left:4px solid var(--line)}
.att li.att-r{border-left-color:var(--red);background:var(--red-soft)}
.att li.att-a{border-left-color:var(--amber);background:var(--amber-soft)}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px}
.sc-t{display:grid;gap:3px;font-size:.78rem;min-width:0}
.sc-t b{font-size:.84rem}
.lc{width:100%;height:auto;display:block}
.lc .grid{stroke:var(--line);stroke-width:1}
.lc .ax{fill:var(--muted);font-size:12px}
.lc .lbl{fill:var(--fg);font-size:13px;font-weight:700}
.kv3{display:flex;gap:14px}
.hb{display:grid;gap:5px}
.hb-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.8rem}
.hb-row[data-c2]{cursor:pointer}
.hb-row[data-c2]:hover .hb-l{color:var(--accent)}
.hb-row.rqrow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto}
.hb-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-bar{display:flex;gap:2px;height:14px;border-radius:3px;overflow:hidden;background:var(--empty)}
.hb-bar i{display:block;height:100%}
.hb-v{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:110px}
.hb-v .pill{min-width:44px;justify-content:center}
.tag{font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.step .t{font-weight:600;font-size:.88rem}
.step .d{font-size:.8rem;color:var(--muted);margin-top:2px}
.step .act{font-size:.78rem;margin-top:4px;color:var(--accent);font-weight:600}
.pr{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;height:fit-content;white-space:nowrap}
.pr.h{background:var(--red);color:var(--on-solid)} .pr.m{background:var(--amber);color:var(--amber-fg)} .pr.l{background:var(--green-soft);color:var(--green)}
table.mx{border-collapse:separate;border-spacing:2px;font-size:.76rem}
.mx th{font-weight:600;color:var(--muted);vertical-align:bottom;padding:2px}
.mx th.vt{height:130px;width:26px}
.mx th.vt span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block}
.mx th[data-c2]{cursor:pointer}
.mx th[data-c2]:hover{color:var(--accent)}
.mx td{width:26px;height:24px;text-align:center;border-radius:3px;font-weight:700;font-variant-numeric:tabular-nums}
.mx td.rq,.mx th.rq{text-align:left;width:auto;min-width:260px;max-width:340px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.mx td.cnt{font-weight:400;color:var(--muted);white-space:nowrap;padding:0 6px}
.c-n{background:var(--na);color:var(--on-solid)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:6px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.hb-row,.hb-row.rqrow{grid-template-columns:minmax(0,1fr) auto}.hb-row .hb-bar{grid-column:1/-1;order:3}.vtabs button{padding:6px 8px;font-size:.78rem}.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .seg{grid-column:1/-1}.filters .fld{min-width:0}.seg button{flex:1;padding:8px 6px}.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:980px){
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .rail-sel.fld{display:flex;margin-top:14px}
  .follow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:620px){
  .grid3{grid-template-columns:minmax(0,1fr)}
  .choices{grid-template-columns:repeat(3,minmax(0,1fr))}
  .choices .ch[data-v="na"]{grid-column:1/-1}
  .ch{flex-direction:column;text-align:center;gap:4px;padding:8px 4px}
  .ch small{font-size:.72rem}
  .follow{grid-template-columns:minmax(0,1fr)}
  .rv-row{grid-template-columns:minmax(0,1fr) auto}
  .rv-row .stack{grid-column:1/-1;order:3}
  .brand span,.who,.npa-div{display:none}
  .npa{font-size:12px}
  .card{padding:18px}
}
/* deliverables */
.dl-sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.dl-sum .v{font-size:1.3rem;font-variant-numeric:tabular-nums;margin-right:2px}
.dl-sec{font-size:1.05rem;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.q.dl{min-width:0}.q.dl>*{min-width:0}
.dl .doc{min-width:0}
.dl-ch{grid-template-columns:repeat(3,minmax(0,1fr))}
.dl-ch .ch{justify-content:center}
.dl-f{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.lk{display:flex;gap:6px}.lk input{flex:1;min-width:0}.lk .btn{padding:6px 12px;white-space:nowrap}

  get(k){ try { const v = localStorage.getItem(k); return v == null ? (mem[k] ?? null) : JSON.parse(v); } catch(e){ return mem[k] ?? null; } },

/* ================= AUTH (ArcGIS OAuth 2.0 with PKCE) ================= */
const Auth = {
  get(){ return LS.get("coar-auth"); },
  valid(){ const a = this.get(); return a && a.token && a.expires > Date.now() + 60000; },
  async start(){
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    LS.set("coar-pkce", {verifier, state});
    const url = `${CONFIG.PORTAL_URL}/sharing/rest/oauth2/authorize?` + new URLSearchParams({client_id:CONFIG.CLIENT_ID, response_type:"code", redirect_uri:CONFIG.REDIRECT_URI, code_challenge:challenge, code_challenge_method:"S256", state, expiration:"20160"});
    if (window.top !== window.self) {            // inside SharePoint iframe: sign in through a popup
      const w = window.open(url, "coar-login", "width=520,height=720");
      if (!w) { renderSignIn("Your browser blocked the sign-in window. Allow pop-ups for this page and try again."); return; }
    } else location.assign(url);
  },
  async exchange(code, state){
    const p = LS.get("coar-pkce");
    if (!p || p.state !== state) throw new Error("Sign-in could not be verified. Please try again.");
    const r = await postForm(`${CONFIG.PORTAL_URL}/sharing/rest/oauth2/token`, {client_id:CONFIG.CLIENT_ID, grant_type:"authorization_code", code, redirect_uri:CONFIG.REDIRECT_URI, code_verifier:p.verifier});
    LS.del("coar-pkce"); this.store(r);
  },
  async refresh(){
    const a = this.get(); if (!a || !a.refresh) return false;
    try { const r = await postForm(`${CONFIG.PORTAL_URL}/sharing/rest/oauth2/token`, {client_id:CONFIG.CLIENT_ID, grant_type:"refresh_token", refresh_token:a.refresh}); this.store({...r, refresh_token: r.refresh_token || a.refresh}); return true; }
    catch(e){ return false; }
  },
  store(r){ LS.set("coar-auth", {token:r.access_token, expires:Date.now() + r.expires_in*1000, refresh:r.refresh_token, username:r.username}); },
  async token(){ if (this.valid()) return this.get().token; if (await this.refresh()) return this.get().token; throw Object.assign(new Error("Your session has expired. Sign in again to keep saving."), {auth:true}); },
  signOut(){ LS.del("coar-auth"); location.reload(); }
};
function b64url(bytes){ let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function postForm(url, params){
  const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({f:"json", ...params})});
  const j = await res.json();
  if (j.error) { const e = new Error(j.error.message || "Request failed"); e.code = j.error.code; if (j.error.code === 498 || j.error.code === 499) e.auth = true; throw e; }
  return j;
}
async function agsPost(url, params){ return postForm(url, {...params, token: await Auth.token()}); }

/* ================= DATA STORES ================= */
class ArcGISStore {
  constructor(url){ this.url = url.replace(/\/$/, ""); }
  async init(){
    let info;
    try { info = await agsPost(this.url, {}); }
    catch(e) { if (e.auth) throw e; throw new Error("You don't have access to this country office's assessment, or its address in config.js is wrong. Ask HO to check that you are in the right COAR group."); }
    this.fields = {}; this.types = {};
    info.fields.forEach(f => { this.fields[f.name.toLowerCase()] = f.name; this.types[f.name] = f.type; });
    this.oid = info.objectIdField || (info.fields.find(f => f.type === "esriFieldTypeOID") || {}).name;
    this.missing = ["country","assessment_year","submission_status",ITEMS[0].id,"last_section",SECTIONS[0].code+"_edited_by"].filter(f => !this.fields[f.toLowerCase()]);
    if (this.missing.length) throw new Error("The layer is missing fields this form needs: " + this.missing.join(", ") + ". Republish the survey from the latest form spreadsheet.");
  }
  f(n){ return this.fields[n.toLowerCase()]; }
  toLayer(attrs){ const o = {}; for (const [k,v] of Object.entries(attrs)) { const f = this.f(k); if (!f) continue;
      if (this.types[f] === "esriFieldTypeDate") o[f] = v ? (typeof v === "number" ? v : Date.parse(v + "T12:00:00Z")) : null;
      else if (/Integer|Double|Single/.test(this.types[f])) o[f] = (v === "" || v == null) ? null : Number(v);
      else o[f] = v === "" ? null : v; }
    return o; }
  fromLayer(a){ const o = {}; ALL_FIELDS.forEach(k => { const f = this.f(k); if (!f) return; let v = a[f];
      o[k] = v; }); return o; }
  async findAll(){
    const out = []; let offset = 0;
    for (;;) {
      const r = await agsPost(this.url + "/query", {where:"1=1", outFields:"*", orderByFields:this.oid + " ASC", returnGeometry:"false", resultOffset:String(offset), resultRecordCount:"1000"});
      (r.features || []).forEach(f => out.push(this.fromLayer(f.attributes)));
      if (!r.exceededTransferLimit || !(r.features || []).length) break; offset += r.features.length;
    }
    return out;
  }
  async find(country, year){
    const where = `${this.f("country")}='${country.replace(/'/g,"''")}' AND ${this.f("assessment_year")}='${String(year).replace(/'/g,"''")}'`;
    const r = await agsPost(this.url + "/query", {where, outFields:"*", orderByFields:this.oid + " ASC", returnGeometry:"false"});
    const fs = r.features || [], st = this.f("submission_status");
    const filled = f => ITEMS.filter(it => { const k = this.f(it.id); return k && f.attributes[k] != null && f.attributes[k] !== ""; }).length;
    const ft = fs.slice().sort((x, y) => (y.attributes[st] === "submitted") - (x.attributes[st] === "submitted") || filled(y) - filled(x) || x.attributes[this.oid] - y.attributes[this.oid])[0];
    return ft ? {oid: ft.attributes[this.oid], attrs: this.fromLayer(ft.attributes)} : null;
  }
  async create(attrs){
    const r = await agsPost(this.url + "/applyEdits", {adds: JSON.stringify([{attributes: this.toLayer(attrs)}])});
    const x = r.addResults && r.addResults[0];
    if (!x || !x.success) throw new Error((x && x.error && x.error.description) || "Could not create the assessment record.");
    return x.objectId;
  }
  async update(oid, attrs){
    const a = this.toLayer(attrs); a[this.oid] = oid;
    const r = await agsPost(this.url + "/applyEdits", {updates: JSON.stringify([{attributes: a}])});
    const x = r.updateResults && r.updateResults[0];
    if (!x || !x.success) throw new Error((x && x.error && x.error.description) || "Save failed.");
  }
}
class DemoStore {
  constructor(){ this.key = "coar-demo-db2"; if (!LS.get(this.key)) LS.set(this.key, seedDemo()); }
  db(){ return LS.get(this.key); }
  async init(){ await wait(250); }
  async find(country, year){ await wait(300); const r = this.db().records.find(x => x.attrs.country === country && String(x.attrs.assessment_year) === String(year)); return r ? JSON.parse(JSON.stringify(r)) : null; }
  async create(attrs){ await wait(300); const db = this.db(); const oid = db.next++; db.records.push({oid, attrs:{...attrs}}); LS.set(this.key, db); return oid; }
  async update(oid, attrs){ await wait(450); if (APP.demoOffline) throw new Error("No connection"); const db = this.db(); const r = db.records.find(x => x.oid === oid); Object.assign(r.attrs, attrs); LS.set(this.key, db); }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function seedDemo(){
  const recs = []; let next = 1;
  const mk = (country, year, secs, who, status) => {
    const a = {country, assessment_year:year, submission_status:status, respondent_role:"country_director", respondent_name:who};
    let seed = year * 7 + country.length;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    secs.forEach(code => { bySec(code).forEach(it => { const x = rnd(); const s = x < .15 ? "1" : x < .42 ? "2" : "3"; a[it.id] = s;
        if (s !== "3") a[it.id+"_comment"] = "Partly documented"; });
      Object.assign(a, calcSection(a, code)); a[code+"_edited_by"] = who; a[code+"_edited_at"] = Date.UTC(2026, 8, 24, 10, 15); });
    Object.assign(a, calcTotals(a)); a.last_section = secs.length;
    recs.push({oid: next++, attrs:a});
  };
  mk("bosnia_and_herzegovina", "2027", ["SMS","INT","DON","COM"], "Amra Hodžić", "draft");
  ["DLV_01","DLV_04","DLV_05","DLV_09","DLV_13"].forEach((id, i) => { const a = recs[0].attrs; a[id] = i < 3 ? "yes" : "partially"; if (i < 3) a[id + "_link"] = "https://npaid.sharepoint.com/sites/example/" + id; a[id + "_date"] = Date.UTC(2026, 9, 2 + i, 9); a.dlv_edited_by = "Amra Hodžić"; a.dlv_edited_at = Date.UTC(2026, 9, 6, 9); });
  mk("bosnia_and_herzegovina", "2026", SECTIONS.map(s => s.code), "Amra Hodžić", "submitted");
  return {next, records: recs};
}

/* ================= SCORING ================= */
function calcSection(a, code){
  let r=0, am=0, g=0, na=0;
  bySec(code).forEach(it => { const v = a[it.id]; if (v === "1") r++; else if (v === "2") am++; else if (v === "3") g++; else if (v === "na") na++; });
  const n = r + am + g, avg = n ? Math.round((r + am*2 + g*3) / n * 100) / 100 : null;
  return {[code+"_red"]:r, [code+"_amber"]:am, [code+"_green"]:g, [code+"_na"]:na, [code+"_done"]:r+am+g+na, [code+"_avg"]:avg, [code+"_rag"]:rag(avg)};
}
function calcTotals(a){
  const t = {red:0, amber:0, green:0, na:0};
  SECTIONS.forEach(s => { const c = calcSection(a, s.code); t.red += c[s.code+"_red"]; t.amber += c[s.code+"_amber"]; t.green += c[s.code+"_green"]; t.na += c[s.code+"_na"]; });
  const n = t.red + t.amber + t.green, avg = n ? Math.round((t.red + t.amber*2 + t.green*3) / n * 100) / 100 : null;
  return {total_red:t.red, total_amber:t.amber, total_green:t.green, total_na:t.na, total_done:n + t.na, overall_avg:avg, overall_rag:rag(avg)};
}
const rag = v => v == null ? "" : v >= 2.5 ? "Green" : v >= 1.75 ? "Amber" : "Red";
const answered = (a, it) => a[it.id] != null && a[it.id] !== "";
function secProgress(a, code){ const its = bySec(code); const c = calcSection(a, code); return {...c, n: its.length, done: c[code+"_done"], r:c[code+"_red"], am:c[code+"_amber"], g:c[code+"_green"], na:c[code+"_na"]}; }
const fmtDate = ms => ms ? new Date(ms).toLocaleString(undefined, {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";

/* ================= APP STATE ================= */
const APP = { user:null, store:null, country:null, year:CONFIG.DEFAULT_YEAR, role:null, oid:null, rec:{}, prev:{}, pending:{}, sec:0,
  saveState:"saved", lastSaved:null, timer:null, retry:null, saving:false, demoOffline:false, confirming:false, welcome:null };

function readOnly(){ return APP.rec.submission_status === "submitted"; }
function pendingKey(){ return `coar-pending:${APP.country}:${APP.year}`; }

function setSave(state, text){
  APP.saveState = state; const el = document.getElementById("savest"); el.hidden = false; el.dataset.s = state;
  document.getElementById("savest-t").textContent = text || ({saved: APP.lastSaved ? "All changes saved · " + new Date(APP.lastSaved).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "All changes saved", saving:"Saving…", offline:"Not saved yet – offline, retrying", error:"Not saved – sign in again"})[state];
}

function setField(name, value, code){
  if (readOnly()) return;
  APP.rec[name] = value; APP.pending[name] = value;
  if (code) {
    const stamp = {[code+"_edited_by"]: APP.user.name, [code+"_edited_at"]: Date.now()};
    Object.assign(APP.rec, stamp, calcSection(APP.rec, code)); Object.assign(APP.pending, stamp, calcSection(APP.rec, code));
    const t = calcTotals(APP.rec); Object.assign(APP.rec, t); Object.assign(APP.pending, t);
  }
  LS.set(pendingKey(), APP.pending);
  setSave("saving", "Unsaved changes…");
  clearTimeout(APP.timer); APP.timer = setTimeout(flush, 1200);
}

async function flush(){
  clearTimeout(APP.timer);
  if (APP.saving) { APP.timer = setTimeout(flush, 800); return true; }
  const batch = APP.pending; if (!Object.keys(batch).length) { if (APP.saveState !== "saved") setSave("saved"); return true; }
  APP.pending = {}; APP.saving = true; setSave("saving");
  try {
    await APP.store.update(APP.oid, batch);
    APP.lastSaved = Date.now(); APP.saving = false;
    if (!Object.keys(APP.pending).length) { LS.del(pendingKey()); setSave("saved"); } else LS.set(pendingKey(), APP.pending);
    clearTimeout(APP.retry); return true;
  } catch(e) {
    APP.saving = false; APP.pending = {...batch, ...APP.pending}; LS.set(pendingKey(), APP.pending);
    if (e.auth) { setSave("error"); renderSignIn(e.message, true); return false; }
    setSave("offline"); clearTimeout(APP.retry); APP.retry = setTimeout(flush, 15000); return false;
  }
}
window.addEventListener("online", () => flush());
window.addEventListener("beforeunload", e => { if (Object.keys(APP.pending).length || APP.saving) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

async function openAssessment(){
  const url = DEMO ? null : (CONFIG.COUNTRY_LAYER_URLS[APP.country] || CONFIG.LAYER_URL);
  APP.store = DEMO ? new DemoStore() : new ArcGISStore(url);
  await APP.store.init();
  let rec = await APP.store.find(APP.country, APP.year);
  let isNew = false;
  if (!rec) {
    const attrs = {country:APP.country, assessment_year:APP.year, submission_status:"draft", ho_review_status:"not_reviewed", respondent_role:APP.role, respondent_name:APP.user.name, respondent_email:APP.user.email, last_section:0};
    await APP.store.create(attrs);
    rec = await APP.store.find(APP.country, APP.year);   // re-read: if two people created at once, everyone uses the oldest record
    isNew = true;
  }
  APP.oid = rec.oid; APP.rec = rec.attrs;
  const prevRec = await APP.store.find(APP.country, String(Number(APP.year) - 1)).catch(() => null);
  APP.prev = prevRec ? prevRec.attrs : {};
  // restore anything that did not reach the server last time
  const backup = LS.get(pendingKey());
  APP.pending = {};
  if (backup && Object.keys(backup).length) { const keep = readOnly() ? Object.fromEntries(Object.entries(backup).filter(([k]) => /^(DLV_|dlv_)/.test(k))) : backup;
    Object.assign(APP.rec, keep); APP.pending = {...keep}; }
  const done = ITEMS.filter(it => answered(APP.rec, it)).length;
  const firstOpen = SECTIONS.findIndex(s => secProgress(APP.rec, s.code).done < bySec(s.code).length);
  const lastSec = Number(APP.rec.last_section);
  APP.sec = readOnly() ? SECTIONS.length : (Number.isFinite(lastSec) && lastSec >= 0 && lastSec <= SECTIONS.length && APP.rec.last_section != null ? lastSec : Math.max(0, firstOpen));
  const lastEdit = SECTIONS.map(s => ({t: APP.rec[s.code+"_edited_at"], by: APP.rec[s.code+"_edited_by"]})).filter(x => x.t).sort((a,b) => b.t - a.t)[0];
  APP.welcome = isNew ? {isNew:true} : {done, lastEdit};
  APP.lastSaved = Date.now();
  if (!readOnly()) { APP.rec.respondent_role = APP.role; APP.pending.respondent_role = APP.role; APP.pending.respondent_name = APP.user.name; if (APP.user.email) APP.pending.respondent_email = APP.user.email; }
  if (Object.keys(APP.pending).length) flush();
  setSave(Object.keys(APP.pending).length ? "saving" : "saved");
  document.getElementById("brand-sub").textContent = `${lbl(DATA.countries, APP.country)} · ${APP.year}`;
  showMain();
}

function goSection(i){
  APP.sec = Math.max(0, Math.min(SECTIONS.length, i)); APP.confirming = false; APP.welcome = null;
  if (!readOnly()) { APP.rec.last_section = APP.sec; APP.pending.last_section = APP.sec; LS.set(pendingKey(), APP.pending); flush(); }
  renderForm(); window.scrollTo({top:0});
}

const DASH = {mode:"overview", year:CONFIG.DEFAULT_YEAR, country:null, data:null, loadedAt:null, error:null};
const SEC_COLOR = {r:"red", am:"amber", g:"green", na:"na"};
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const ragClass = v => ({Green:"g", Amber:"a", Red:"r"})[rag(v)] || "x";
// Compliance %: fully = 100%, partially = 50%, not in compliance = 0%, N/A left out. Same as (average score - 1) / 2.
const cp = avg => avg == null ? null : (avg - 1) / 2 * 100;
const fp = avg => avg == null ? "–" : Math.round(cp(avg)) + "%";
const fpp = d => (d >= 0 ? "+" : "−") + Math.abs(Math.round(d * 50)) + " pts";   // change in average -> percentage points
const dArrow = d => `<span class="delta ${d > 0.04 ? "up" : d < -0.04 ? "down" : ""}">${d > 0.04 ? "▲" : d < -0.04 ? "▼" : "■"} ${fpp(d)}</span>`;
const THRESH = "Green 75% and above · Amber 38–74% · Red below 38%";

async function loadDash(force){
  if (DASH.data && !force) return;
  DASH.error = null;
  try {
    let recs;
    if (DEMO) recs = demoDashData();
    else { const st = new ArcGISStore(CONFIG.LAYER_URL); try { await st.init(); } catch(e) { if (e.auth) throw e; throw new Error("The dashboard reads the main layer, which only HO reviewers can open. Ask the form administrator to add you to the COAR – HO reviewers group."); } recs = await st.findAll(); }
    // One record per country and year. If there are several, use the submitted one (or the one with most answers) and report the duplicates.
    const groups = {};
    recs.forEach(a => { if (!a.country) return; const k = a.country + "|" + a.assessment_year; (groups[k] = groups[k] || []).push(a); });
    const answeredN = a => ITEMS.filter(it => a[it.id] != null && a[it.id] !== "").length;
    DASH.dups = []; DASH.total = recs.length;
    DASH.data = Object.values(groups).map(g => { if (g.length > 1) DASH.dups.push({country:g[0].country, year:g[0].assessment_year, n:g.length});
      return g.slice().sort((x, y) => (y.submission_status === "submitted") - (x.submission_status === "submitted") || answeredN(y) - answeredN(x))[0]; });
    DASH.loadedAt = Date.now();
  } catch(e) { DASH.error = e; }
}
function demoDashData(){
  const out = []; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const years = ["2024","2025","2026","2027"];
  DATA.countries.forEach((c, ci) => {
    const base = 1.75 + rnd() * 0.75, slope = (rnd() - 0.35) * 0.28;
    years.forEach((y, yi) => {
      if (yi === 3 && ci % 5 === 4) return;                       // not started yet
      const partial = yi === 3 && ci % 4 === 1;                    // in progress
      const a = {country:c.v, assessment_year:y, submission_status: partial ? "draft" : "submitted"};
      SECTIONS.forEach((s, si) => {
        if (partial && si > 7) return;
        const adj = (rnd() - 0.5) * 0.7;
        bySec(s.code).forEach(it => {
          const v = base + slope * yi + adj + (rnd() - 0.5) * 1.3;
          a[it.id] = rnd() < 0.04 ? "na" : v < 1.65 ? "1" : v < 2.45 ? "2" : "3";
          if (a[it.id] === "1" && rnd() < 0.5) a[it.id + "_comment"] = "Not yet in place; plan agreed with HO";
        });
      });
      if (!partial) { a.submitted_by = "Country Director"; a.submitted_at = Date.UTC(Number(y), 0, 20 + ci % 8); }
      if (yi >= 2 && !(yi === 3 && ci % 6 === 5)) DATA.deliverables.forEach((d, di) => { const x = rnd() + (yi === 2 ? .25 : 0) + base / 10 - .2;
        if (yi === 3 && x < .25) return; a[d.id] = x > .62 ? "yes" : x > .42 ? "partially" : "no";
        if (a[d.id] === "yes") a[d.id + "_link"] = "https://npaid.sharepoint.com/sites/example/" + c.v + "/" + d.id;
        if (a[d.id] === "partially" && rnd() < .5) a[d.id + "_comment"] = "Draft shared with HO"; });
      out.push(a);
    });
  });
  const db = LS.get("coar-demo-db2");                               // records entered in this browser override the examples
  if (db && db.records) db.records.forEach(r => { const i = out.findIndex(a => a.country === r.attrs.country && String(a.assessment_year) === String(r.attrs.assessment_year)); if (i >= 0) out[i] = r.attrs; else out.push(r.attrs); });
  return out;
}

const statusOf = a => !a ? "Not started" : a.submission_status === "submitted" ? "Submitted" : "In progress";

/* ---- chart helpers (SVG) ---- */
function donut(segs, total, size, stroke, center, sub){
  const r = (size - stroke) / 2, C = 2 * Math.PI * r; let off = 0;
  const arcs = segs.filter(s => s.v > 0).map(s => { const len = s.v / total * C, gap = len > 4 ? 2 : 0;
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--${s.c})" stroke-width="${stroke}" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}" data-tip="${esc(s.tip)}"/>`; off += len; return el; }).join("");
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(segs.map(s => s.tip).join("; "))}">
    <g transform="rotate(-90 ${size/2} ${size/2})"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--empty)" stroke-width="${stroke}"/>${arcs}</g>
    <text x="50%" y="${sub ? "47%" : "50%"}" text-anchor="middle" dominant-baseline="central" class="dn-c" style="font-size:${size/4.4}px">${center}</text>
    ${sub ? `<text x="50%" y="66%" text-anchor="middle" dominant-baseline="central" class="dn-s" style="font-size:${size/11}px">${sub}</text>` : ""}</svg>`;
}
function segsOf(st, label){
  const ans = st.r + st.am + st.g + st.na;
  return [{v:st.r, c:"red", tip:`${label}: ${st.r} not in compliance (${pct(st.r, ans)}% of answered)`},
          {v:st.am, c:"amber", tip:`${label}: ${st.am} partially (${pct(st.am, ans)}%)`},
          {v:st.g, c:"green", tip:`${label}: ${st.g} fully in compliance (${pct(st.g, ans)}%)`},
          {v:st.na, c:"na", tip:`${label}: ${st.na} not applicable (${pct(st.na, ans)}%)`}];
}
function lineChart(points){ // points: [{x:"2023", y:2.1}]
  const W = 640, H = 260, L = 44, R = 24, T = 16, B = 34, ymin = 1, ymax = 3;
  const xs = i => points.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (points.length - 1);
  const ys = v => T + (ymax - v) / (ymax - ymin) * (H - T - B);
  const band = (a, b, c) => `<rect x="${L}" y="${ys(b)}" width="${W - L - R}" height="${ys(a) - ys(b)}" style="fill:var(--${c}-soft)" opacity=".55"/>`;
  const valid = points.map((p, i) => ({...p, i})).filter(p => p.y != null);
  const path = valid.map((p, k) => `${k ? "L" : "M"}${xs(p.i).toFixed(1)},${ys(p.y).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="lc" role="img" aria-label="Overall compliance by year">
    ${band(1, 1.75, "red")}${band(1.75, 2.5, "amber")}${band(2.5, 3, "green")}
    ${[1, 1.5, 2, 2.5, 3].map(v => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" class="grid"/><text x="${L - 8}" y="${ys(v)}" text-anchor="end" dominant-baseline="central" class="ax">${fp(v)}</text>`).join("")}
    ${points.map((p, i) => `<text x="${xs(i)}" y="${H - 10}" text-anchor="middle" class="ax">${p.x}</text>`).join("")}
    <path d="${path}" fill="none" style="stroke:var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${valid.map((p, k) => `<circle cx="${xs(p.i)}" cy="${ys(p.y)}" r="6" style="fill:var(--${({g:"green",a:"amber",r:"red"})[ragClass(p.y)]});stroke:var(--surface)" stroke-width="2" data-tip="${p.x}: overall compliance ${fp(p.y)} (${rag(p.y)})"/>${k === valid.length - 1 ? `<text x="${xs(p.i)}" y="${ys(p.y) - 14}" text-anchor="middle" class="lbl">${fp(p.y)}</text>` : ""}`).join("")}
  </svg>`;
}
function stackCols(rows){ // rows: [{x, st}]
  const W = 640, H = 220, L = 44, R = 24, T = 12, B = 34, n = rows.length, slot = (W - L - R) / Math.max(n, 1), bw = Math.min(56, slot * .5);
  const y = p => T + (1 - p) * (H - T - B);
  let out = [0, .25, .5, .75, 1].map(p => `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}" class="grid"/><text x="${L - 8}" y="${y(p)}" text-anchor="end" dominant-baseline="central" class="ax">${p * 100}%</text>`).join("");
  rows.forEach((row, i) => { const st = row.st, ans = st.r + st.am + st.g + st.na, cx = L + slot * i + slot / 2; let acc = 0;
    out += `<text x="${cx}" y="${H - 10}" text-anchor="middle" class="ax">${row.x}</text>`;
    if (!ans) return;
    [["r","red","not in compliance"],["am","amber","partially"],["g","green","fully"],["na","na","N/A"]].forEach(([k, c, lab]) => { const v = st[k] / ans; if (!v) return;
      const y1 = y(acc + v), h = y(acc) - y1; out += `<rect x="${cx - bw/2}" y="${y1 + 1}" width="${bw}" height="${Math.max(h - 2, 0.5)}" style="fill:var(--${c})" data-tip="${row.x}: ${st[k]} ${lab} (${Math.round(v * 100)}%)"/>`; acc += v; }); });
  return `<svg viewBox="0 0 ${W} ${H}" class="lc" role="img" aria-label="Share of scores by year">${out}</svg>`;
}
const legend = () => `<div class="legend"><span><i class="dot" style="background:var(--red)"></i>1 · Not in compliance</span><span><i class="dot" style="background:var(--amber)"></i>2 · Partially</span><span><i class="dot" style="background:var(--green)"></i>3 · Fully</span><span><i class="dot" style="background:var(--na)"></i>N/A</span><span><i class="dot" style="background:var(--empty);outline:1px solid var(--line)"></i>Not answered</span></div>`;

function dueDate(d, year){ if (!d.due) return null; const [m, dd] = d.due.split("-").map(Number); return Date.UTC(Number(year), m - 1, dd, 23, 59); }
function dueLabel(d, year){ if (!d.due) return "No due date set"; const t = dueDate(d, year); return "Due " + new Date(t).toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric", timeZone:"UTC"}) + (d.dueText.includes("confirm") ? " (to be confirmed)" : ""); }
const isOverdue = (d, year, status) => { const t = dueDate(d, year); return t != null && Date.now() > t && status !== "yes"; };

/* ---- dashboard view: deliverables across all offices ---- */
const ISO3 = {afghanistan:"AFG", angola:"AGO", bosnia_and_herzegovina:"BIH", cambodia:"KHM", colombia:"COL", ecuador:"ECU", ethiopia:"ETH", iraq:"IRQ", kosovo:"XKX", lao_pdr:"LAO", lebanon:"LBN", mozambique:"MOZ", myanmar:"MMR", palestine:"PSE", peru:"PER", rwanda:"RWA", south_sudan:"SSD", sudan:"SDN", syria:"SYR", thailand:"THA", ukraine:"UKR", vietnam:"VNM", yemen:"YEM", zimbabwe:"ZWE"};
const iso3 = c => ISO3[c.v] || c.l.replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
function viewDeliverables(){
  const y = String(DASH.year), N = DATA.countries.length;
  const offices = DATA.countries.map(c => { const a = recFor(c.v, y); return {c, a, n: dlvCounts(a, y)}; });
  const total = N * DLV.length;
  const yes = offices.reduce((s, o) => s + o.n.yes, 0), part = offices.reduce((s, o) => s + o.n.partially, 0), over = offices.reduce((s, o) => s + o.n.overdue, 0);
  const allDone = offices.filter(o => o.n.yes === DLV.length).length, silent = offices.filter(o => o.n.none === DLV.length).length;
  const per = DLV.map(d => { const st = {r:0, am:0, g:0, na:0, open:0}, od = [];
    offices.forEach(o => { const s = o.a ? o.a[d.id] : null; if (s === "yes") st.g++; else if (s === "partially") st.am++; else if (s === "no") st.r++; else st.open++; if (isOverdue(d, y, s)) od.push(o.c.l); });
    return {d, st, od, rate: st.g / N}; });
  const perById = Object.fromEntries(per.map(p => [p.d.id, p]));
  const cell = (o, d) => { const s = o.a ? o.a[d.id] : null, link = o.a ? o.a[d.id + "_link"] : "", ov = isOverdue(d, y, s);
    const cls = s === "yes" ? "c-g" : s === "partially" ? "c-a" : s === "no" ? "c-r" : "c-x", sym = s === "yes" ? "✓" : s === "partially" ? "½" : s === "no" ? "✗" : "";
    const tip = `${o.c.l} · ${d.id.replace("_", "-")} ${d.t}: ${s ? DLV_LABEL[s] : "not reported"}${ov ? " · overdue" : ""}${o.a && o.a[d.id + "_comment"] ? " — “" + o.a[d.id + "_comment"] + "”" : ""}${isUrl(link) ? " · click to open the document" : ""}`;
    return `<td class="${cls}${ov ? " ovd" : ""}" data-tip="${esc(tip)}">${isUrl(link) ? `<a href="${esc(link)}" target="_blank" rel="noopener">${sym}</a>` : sym}</td>`; };
  const dueCell = (p) => `<span class="dd">${esc(p.d.due ? p.d.dueText : "No due date")}</span>${p.od.length ? `<span class="delta down" data-tip="Overdue: ${esc(p.od.join(", "))}">${p.od.length} overdue</span>` : ""}`;
  const cols = N + 2;
  return `<p class="note">Deliverables reported by each country office for ${esc(y)}. ✓ delivered · ½ partially · ✗ not yet · blank: not reported. A red outline means the due date has passed and the deliverable is not yet delivered. Click a ✓ to open the office's document.</p>
  <div class="kpis">
    <div class="kpi"><span class="l">Delivered across all offices</span><span class="v">${pct(yes, total)}%</span><span class="s">${yes} of ${total} · ${part} partially</span></div>
    <div class="kpi"><span class="l">Offices with everything delivered</span><span class="v">${allDone}<small> / ${N}</small></span><span class="s">all ${DLV.length} deliverables marked yes</span></div>
    <div class="kpi"><span class="l">Overdue</span><span class="v" style="color:${over ? "var(--red)" : "inherit"}">${over}</span><span class="s">past the due date, not delivered</span></div>
    <div class="kpi"><span class="l">Offices not reporting</span><span class="v">${silent}<small> / ${N}</small></span><span class="s">no deliverable marked yet</span></div>
  </div>
  <div class="panel"><h2>Deliverables by office, ${esc(y)}</h2><p class="sub">Deliverables down the side, grouped by section; country offices across (hover a code for the name, click it for the office's profile).</p>
    <div class="hm-scroll"><table class="mx dlx"><thead>
      <tr><th class="rq">Deliverable</th>${offices.map(o => `<th class="cc" data-c2="${o.c.v}" data-tip="${esc(o.c.l)}${!o.a ? " · not started" : ""}">${esc(iso3(o.c))}</th>`).join("")}<th class="cnt">Offices<br>delivered</th></tr></thead>
    <tbody>${DLV_SECS.map(sec => `<tr class="secrow"><th colspan="${cols}">${esc(sec)}</th></tr>` + DLV.filter(d => d.sec === sec).map(d => { const p = perById[d.id];
      return `<tr><td class="rq"><span class="mono">${d.id.replace("_", "-")}</span> ${esc(d.t)} <span class="tag">${esc(d.lead)}</span>${d.due ? ` <span class="muted dd-in">· ${esc(d.dueText)}</span>` : ""}</td>${offices.map(o => cell(o, d)).join("")}<td class="cnt"><b>${p.st.g}</b> / ${N}</td></tr>`; }).join("")).join("")}
    </tbody><tfoot><tr><td class="rq muted">Delivered per office</td>${offices.map(o => `<td class="cnt cf" data-tip="${esc(o.c.l)}: ${o.n.yes} of ${DLV.length} delivered">${o.n.yes}</td>`).join("")}<td class="cnt">of ${DLV.length}</td></tr></tfoot></table></div>
    <div class="legend" style="margin-top:8px"><span><i class="dot" style="background:var(--green)"></i>✓ Delivered</span><span><i class="dot" style="background:var(--amber)"></i>½ Partially</span><span><i class="dot" style="background:var(--red)"></i>✗ Not yet</span><span><i class="dot" style="background:var(--empty);outline:1px solid var(--line)"></i>Not reported</span><span><i class="dot" style="background:var(--surface);outline:2px solid var(--red)"></i>Overdue</span></div></div>
  <div class="panel" style="margin-top:16px"><h2>Deliverables, least delivered first</h2><p class="sub">How many of the ${N} offices have delivered each one, with its due date. Use it to follow up with function leads.</p>
    <div class="dlb"><div class="dlb-row dlb-h"><span>Deliverable</span><span>Lead</span><span>Offices</span><span>Delivered</span><span>Due date</span></div>
    ${per.slice().sort((p, q) => p.rate - q.rate || q.st.r - p.st.r).map(p => `<div class="dlb-row"><span class="dlb-l" title="${esc(p.d.t)}"><span class="mono">${p.d.id.replace("_", "-")}</span> ${esc(p.d.t)}</span><span class="dlb-lead"><span class="tag">${esc(p.d.lead)}</span></span>${hbar(p.st, p.d.t, p.d.t)}<span><b class="pill ${p.rate >= .75 ? "g" : p.rate >= .38 ? "a" : "r"}">${p.st.g}/${N}</b></span><span class="dlb-due">${dueCell(p)}</span></div>`).join("")}</div>
    <div class="legend" style="margin-top:8px"><span><i class="dot" style="background:var(--green)"></i>Delivered</span><span><i class="dot" style="background:var(--amber)"></i>Partially</span><span><i class="dot" style="background:var(--red)"></i>Not yet</span><span><i class="dot" style="background:var(--empty);outline:1px solid var(--line)"></i>Not reported</span></div></div>`;
}

function renderDash(){
  const root = $app();
  if (!DASH.data && !DASH.error) { root.innerHTML = `<div class="card"><h1>Loading dashboard…</h1><p>Reading all country office assessments.</p></div>`; loadDash().then(renderDash); return; }
  if (DASH.error) { if (DASH.error.auth) { renderSignIn(DASH.error.message, true); return; } root.innerHTML = `<div class="card"><div class="eyebrow">Dashboards</div><h1>The dashboard could not load</h1><p class="note err">${esc(DASH.error.message)}</p><div><button class="btn" id="d-retry">Try again</button></div></div>`; document.getElementById("d-retry").onclick = () => { DASH.error = null; DASH.data = null; renderDash(); }; return; }
  if (!DASH.country) DASH.country = (APP.country && DATA.countries.some(c => c.v === APP.country)) ? APP.country : DATA.countries[0].v;
  const years = yearsAvail();
  const body = DASH.mode === "overview" ? viewOverview() : DASH.mode === "country" ? viewCountry() : DASH.mode === "section" ? viewSection() : DASH.mode === "dlv" ? viewDeliverables() : viewTrend();
  root.innerHTML = `
    <div class="dash-head"><div><div class="eyebrow">Dashboards${DEMO ? " · example data" : ""}</div><h1>${DASH.mode === "overview" ? "All country offices" : DASH.mode === "country" ? "Country office profile" : DASH.mode === "section" ? "By section" : DASH.mode === "dlv" ? "Deliverables" : "Progress over time"}</h1></div>
      <span class="muted" style="font-size:.8rem">${DEMO ? "Example data, not connected to ArcGIS" : `${DASH.total} record${DASH.total === 1 ? "" : "s"} loaded from ArcGIS Online`} · ${DASH.loadedAt ? new Date(DASH.loadedAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : ""} · <button class="linkbtn" id="d-refresh" style="color:var(--accent)">Refresh</button></span></div>
    <div class="filters">
      <div class="seg" role="group" aria-label="View">${[["overview","All offices"],["country","Country profile"],["section","By section"],["trend","Trends"],["dlv","Deliverables"]].map(([k, l]) => `<button data-mode="${k}" aria-pressed="${DASH.mode === k}">${l}</button>`).join("")}</div>
      ${DASH.mode === "section" ? `<div class="fld"><label for="d-section">Section</label><select id="d-section">${SECTIONS.map(x => `<option value="${x.code}" ${x.code === (DASH.section || SECTIONS[0].code) ? "selected" : ""}>${esc(secName(x))}</option>`).join("")}</select></div>` : ""}
      ${DASH.mode === "country" || DASH.mode === "trend" ? `<div class="fld"><label for="d-country">Country office</label><select id="d-country">${DATA.countries.map(c => `<option value="${c.v}" ${c.v === DASH.country ? "selected" : ""}>${esc(c.l)}</option>`).join("")}</select></div>` : ""}
      ${DASH.mode !== "trend" ? `<div class="fld"><label for="d-year">Year</label><select id="d-year">${years.map(y => `<option ${y === String(DASH.year) ? "selected" : ""}>${y}</option>`).join("")}</select></div>` : ""}
    </div>
    ${DASH.dups && DASH.dups.length ? `<p class="note warn">Duplicate records found: ${DASH.dups.map(d => `${esc(lbl(DATA.countries, d.country))} ${esc(d.year)} (${d.n} records)`).join(", ")}. The dashboard uses the submitted one, or the most complete. Delete the extra records in ArcGIS Online (layer › Data tab) to keep things tidy.</p>` : ""}
    ${body}
    <p class="muted" style="font-size:.78rem;margin-top:16px" ${DASH.mode === "dlv" ? "hidden" : ""}>How compliance is calculated: each requirement scored 3 (fully) counts 100%, 2 (partially) 50% and 1 (not in compliance) 0%; N/A and unanswered requirements are left out. ${THRESH}.</p>`;
  root.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { DASH.mode = b.dataset.mode; dashHash(); renderDash(); });

  root.querySelectorAll("[data-att]").forEach(b => b.onclick = () => { DASH.attTab = b.dataset.att;

    root.querySelectorAll("[data-list]").forEach(l => l.hidden = l.dataset.list !== b.dataset.att); });
